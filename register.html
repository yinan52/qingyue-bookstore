<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="青阅书城新用户注册 —— 手机号、邮箱、密码强度实时验证。">
  <title>新用户注册 · 青阅书城</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="stylesheet" href="css/base.css?v=20260911b">
  <link rel="stylesheet" href="css/common.css?v=20260911b">
  <link rel="stylesheet" href="css/page/login.css?v=20260911b">
  <link rel="stylesheet" href="css/page/register.css?v=20260911b">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

  <div class="page-loading" id="pageLoading">
    <div class="loading-logo">青阅书城</div>
    <div class="loading-spinner"></div>
  </div>

  <!-- ========== 公共头部 ========== -->
  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html" title="返回首页">
        <img src="assets/icons/logo.svg" alt="青阅书城 Logo">
        <div>
          <div class="logo-text">青阅书城</div>
          <div class="logo-sub">读万卷书 · 行万里路</div>
        </div>
      </a>
      <nav class="main-nav" aria-label="主导航">
        <ul>
          <li><a href="index.html" data-page="index.html">首页</a></li>
          <li><a href="books.html" data-page="books.html">图书商城</a></li>
          <li><a href="data.html" data-page="data.html">数据看板</a></li>
          <li><a href="paint.html" data-page="paint.html">创意画板</a></li>
          <li><a href="media.html" data-page="media.html">视听馆</a></li>
          <li><a href="about.html" data-page="about.html">关于我们</a></li>
        </ul>
      </nav>
      <div class="header-tools">
        <div class="header-search">
          <input type="search" id="headerSearch" placeholder="搜索图书…" aria-label="站内搜索">
          <button id="headerSearchBtn" aria-label="搜索"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        <a class="icon-btn" href="cart.html" aria-label="购物车">
          <i class="fa-solid fa-cart-shopping"></i>
          <span class="cart-badge">0</span>
        </a>
        <div class="login-area">
          <a class="btn-login" href="login.html">登录</a>
        </div>
        <button class="nav-toggle" id="navToggle" aria-label="展开菜单"><i class="fa-solid fa-bars"></i></button>
      </div>
    </div>
  </header>

  <main class="page-main auth-main">
    <div class="container auth-wrap">

      <!-- 左侧品牌展示区 -->
      <aside class="auth-banner" aria-label="品牌展示">
        <div class="auth-banner-inner">
          <div class="auth-logo">
            <img src="assets/icons/logo.svg" alt="青阅书城 Logo">
            <span>青阅书城</span>
          </div>
          <h2>加入青阅<br>遇见更好的自己</h2>
          <p>注册即送 50 元新人礼券，全场通用</p>
          <ul>
            <li><i class="fa-solid fa-gift"></i> 新人礼券 50 元</li>
            <li><i class="fa-solid fa-bolt"></i> 新书首发 9 折</li>
            <li><i class="fa-solid fa-medal"></i> 会员积分双倍</li>
          </ul>
        </div>
      </aside>

      <!-- 右侧注册表单 -->
      <section class="auth-form-wrap" aria-label="注册表单">
        <div class="form-card">
          <h1 class="form-title">创建账号</h1>
          <p class="form-subtitle">填写以下信息完成注册（均为必填）</p>

          <form id="registerForm" novalidate>
            <!-- 用户名 -->
            <div class="form-item">
              <label for="regUsername"><span class="required">*</span>用户名</label>
              <input type="text" id="regUsername" class="form-control" placeholder="2~16 位字母、数字或中文" autocomplete="username">
              <div class="form-tip" id="regUsernameTip"></div>
            </div>

            <!-- 手机号 -->
            <div class="form-item">
              <label for="regMobile"><span class="required">*</span>手机号</label>
              <input type="tel" id="regMobile" class="form-control" placeholder="请输入 11 位手机号" autocomplete="tel">
              <div class="form-tip" id="regMobileTip"></div>
            </div>

            <!-- 邮箱（HTML5 email 类型验证） -->
            <div class="form-item">
              <label for="regEmail"><span class="required">*</span>邮箱</label>
              <input type="email" id="regEmail" class="form-control" placeholder="example@mail.com" autocomplete="email">
              <div class="form-tip" id="regEmailTip"></div>
            </div>

            
            <!-- 生日（HTML5 date 类型） -->
            <div class="form-item">
              <label for="regBirthday">生日</label>
              <input type="date" id="regBirthday" class="form-control" autocomplete="bday">
              <div class="form-tip" id="regBirthdayTip"></div>
            </div>

<!-- 密码 + 强度 -->
            <div class="form-item">
              <label for="regPassword"><span class="required">*</span>密码</label>
              <div class="input-wrap">
                <input type="password" id="regPassword" class="form-control" placeholder="至少 6 位，含字母和数字" autocomplete="new-password">
                <i class="fa-regular fa-eye-slash" id="regPwdEye" title="显示/隐藏密码"></i>
              </div>
              <div class="pwd-strength" id="pwdStrength">
                <span class="strength-bar"></span>
                <span class="strength-bar"></span>
                <span class="strength-bar"></span>
                <em id="strengthText">密码强度</em>
              </div>
              <div class="form-tip" id="regPasswordTip"></div>
            </div>

            <!-- 确认密码 -->
            <div class="form-item">
              <label for="regConfirm"><span class="required">*</span>确认密码</label>
              <input type="password" id="regConfirm" class="form-control" placeholder="请再次输入密码" autocomplete="new-password">
              <div class="form-tip" id="regConfirmTip"></div>
            </div>

            <!-- 验证码 -->
            <div class="form-item">
              <label for="regCaptcha"><span class="required">*</span>验证码</label>
              <div class="captcha-row">
                <input type="text" id="regCaptcha" class="form-control" placeholder="输入右侧验证码" maxlength="4">
                <canvas class="captcha-canvas" id="regCaptchaCanvas" width="120" height="42" title="点击刷新验证码"></canvas>
              </div>
              <div class="form-tip" id="regCaptchaTip"></div>
            </div>

            <!-- 协议 -->
            <div class="form-item">
              <label class="checkbox-label agree-label">
                <input type="checkbox" id="agreeTerms">
                <span class="mini-check"></span>
                我已阅读并同意
                <a href="about.html" target="_blank">《青阅书城服务协议》</a>
              </label>
              <div class="form-tip" id="agreeTip"></div>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn-primary btn-lg btn-block">
                注 册
              </button>
            </div>

            <p class="form-switch">已有账号？<a href="login.html">直接登录 →</a></p>
          </form>
        </div>
      </section>
    </div>
  </main>

  <!-- ========== 公共页脚 ========== -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border-top: none;">
        <p style="margin-bottom:8px;"><a href="https://github.com/yinan52/qingyue-bookstore" target="_blank" rel="noopener" style="color:inherit;"><i class="fa-brands fa-github"></i> GitHub 源码仓库</a></p>
        <p>© <span class="footer-year">2026</span> 青阅书城 QingYue Bookstore · Web前端设计与开发实训大作业</p>
      </div>
    </div>
  </footer>

  <script src="js/data.js?v=20260911b"></script>
  <script src="js/dom.js?v=20260911b"></script>
  <script src="js/common.js?v=20260911b"></script>
  <script src="js/page/register.js?v=20260911b"></script>
</body>
</html>
