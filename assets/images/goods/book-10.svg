<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400">
<defs>
  <linearGradient id="bg10" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0d47a1"/>
    <stop offset="100%" stop-color="#1565c0"/>
  </linearGradient>
</defs>
<!-- 背景 -->
<rect width="300" height="400" fill="url(#bg10)"/>
<!-- 书脊高光 -->
<rect x="0" y="0" width="10" height="400" fill="rgba(255,255,255,0.14)"/>
<rect x="10" y="0" width="3" height="400" fill="rgba(255,255,255,0.08)"/>
<circle cx="235" cy="52" r="62" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>
<circle cx="250" cy="46" r="30" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>
<circle cx="62" cy="352" r="40" fill="rgba(255,255,255,0.06)"/>
<!-- 顶部品牌栏 -->
<text x="150" y="58" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" letter-spacing="4" fill="rgba(255,255,255,0.85)">青 阅 书 城</text>
<line x1="86" y1="72" x2="214" y2="72" stroke="#90caf9" stroke-width="2" opacity="0.7"/>
<!-- 书名 -->
<text x="150" y="168" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#ffffff">经济学原理</text>

<!-- 分隔线 -->
<line x1="110" y1="286" x2="190" y2="286" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
<!-- 作者 -->
<text x="150" y="318" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="rgba(255,255,255,0.92)">N.格里高利·曼昆</text>
<!-- 底部序号 -->
<text x="150" y="372" text-anchor="middle" font-family="Georgia,serif" font-size="12" letter-spacing="6" fill="rgba(255,255,255,0.5)">QING YUE · 10</text>
</svg>